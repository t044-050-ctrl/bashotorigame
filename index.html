<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ばしょとりゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      touch-action: none;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Main Container (Full Viewport) */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    /* Board & Color Buttons Wrapper */
    .board-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(min(68vw, 68vh) / 5);
    }

    /* Action Buttons (Square with rounded corners) */
    .action-btn {
      position: absolute;
      width: min(10vw, 12vh);
      height: min(10vw, 12vh);
      font-size: min(1.5vw, 1.7vh);
      font-weight: bold;
      background-color: #f8fafc;
      color: #334155;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
      z-index: 10;
      display: none; /* Hidden by default */
      justify-content: center;
      align-items: center;
      white-space: nowrap;
      padding: 4px;
    }
    .action-btn.visible {
      display: flex;
    }
    .action-btn:active {
      background-color: #e2e8f0;
    }
    .action-top-left {
      top: 24px;
      left: 24px;
      transform: rotate(90deg);
    }
    .action-top-left:active {
      transform: rotate(90deg) scale(0.95);
    }
    .action-bottom-right {
      bottom: 24px;
      right: 24px;
      transform: rotate(270deg);
    }
    .action-bottom-right:active {
      transform: rotate(270deg) scale(0.95);
    }

    /* Blue / Red Color Buttons */
    .color-btn {
      width: min(8.8vw, 10.4vh);
      height: min(17.6vw, 20.8vh);
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      outline: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .btn-blue {
      background: #4A83C2;
      border: 3px solid #7eaadb;
      box-shadow: 0 4px 12px rgba(74, 131, 194, 0.3);
    }
    .btn-blue.active {
      box-shadow: 0 0 18px min(1.5vw, 1.5vh) rgba(74, 131, 194, 0.6), inset 0 0 8px #ffffff;
      transform: scale(1.05);
      border-color: #a2c6ed;
    }

    .btn-red {
      background: #F76A57;
      border: 3px solid #f9998c;
      box-shadow: 0 4px 12px rgba(247, 106, 87, 0.3);
    }
    .btn-red.active {
      box-shadow: 0 0 18px min(1.5vw, 1.5vh) rgba(247, 106, 87, 0.6), inset 0 0 8px #ffffff;
      transform: scale(1.05);
      border-color: #fbbbb1;
    }

    /* 5x5 Grid Board Container */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      width: min(68vw, 68vh);
      height: min(68vw, 68vh);
      background-color: #ffffff;
      border: 2px solid #334155;
      border-radius: 4px;
    }

    /* Cell Selection Animation */
    @keyframes pushGlowBlue {
      0% { transform: scale(1); box-shadow: none; }
      50% { transform: scale(0.88); box-shadow: 0 0 16px rgba(74, 131, 194, 0.8); z-index: 5; }
      100% { transform: scale(1); box-shadow: none; }
    }
    @keyframes pushGlowRed {
      0% { transform: scale(1); box-shadow: none; }
      50% { transform: scale(0.88); box-shadow: 0 0 16px rgba(247, 106, 87, 0.8); z-index: 5; }
      100% { transform: scale(1); box-shadow: none; }
    }

    /* Individual Cells */
    .cell {
      background-color: #ffffff;
      border: 1px solid #334155;
      cursor: pointer;
      transition: background-color 0.2s ease;
      position: relative;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cell.blue {
      background-color: #4A83C2;
      cursor: default;
      animation: pushGlowBlue 0.35s ease-out forwards;
    }
    .cell.red {
      background-color: #F76A57;
      cursor: default;
      animation: pushGlowRed 0.35s ease-out forwards;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- Sort Buttons -->
    <button class="action-btn action-top-left" id="sortTop">ならべかえ</button>
    <button class="action-btn action-bottom-right" id="sortBottom">ならべかえ</button>

    <!-- Reset Buttons -->
    <button class="action-btn action-top-left" id="resetTop">はじめから</button>
    <button class="action-btn action-bottom-right" id="resetBottom">はじめから</button>

    <div class="board-wrapper">
      <button class="color-btn btn-blue" id="btnBlue" aria-label="Blue"></button>
      <div class="grid-container" id="grid"></div>
      <button class="color-btn btn-red" id="btnRed" aria-label="Red"></button>
    </div>
  </div>

  <script>
    let selectedColor = null;

    // Prevent default touch gestures (swiping/scrolling)
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    const btnBlue = document.getElementById('btnBlue');
    const btnRed = document.getElementById('btnRed');
    const grid = document.getElementById('grid');
    
    const sortTop = document.getElementById('sortTop');
    const sortBottom = document.getElementById('sortBottom');
    const resetTop = document.getElementById('resetTop');
    const resetBottom = document.getElementById('resetBottom');

    // Create 5x5 Grid Cells
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.addEventListener('click', () => onCellClick(cell));
      grid.appendChild(cell);
    }

    btnBlue.addEventListener('click', () => toggleColor('blue'));
    btnRed.addEventListener('click', () => toggleColor('red'));

    function toggleColor(color) {
      if (selectedColor === color) {
        selectedColor = null;
      } else {
        selectedColor = color;
      }
      updateButtonStyles();
    }

    function updateButtonStyles() {
      btnBlue.classList.toggle('active', selectedColor === 'blue');
      btnRed.classList.toggle('active', selectedColor === 'red');
    }

    function onCellClick(cell) {
      if (!selectedColor) return;
      if (cell.classList.contains('blue') || cell.classList.contains('red')) return;

      cell.classList.add(selectedColor);
      selectedColor = null;
      updateButtonStyles();

      // Check if all 25 cells are filled
      const filledCells = document.querySelectorAll('.cell.blue, .cell.red');
      if (filledCells.length === 25) {
        showSortButtons();
      }
    }

    function showSortButtons() {
      sortTop.classList.add('visible');
      sortBottom.classList.add('visible');
    }

    function hideSortButtons() {
      sortTop.classList.remove('visible');
      sortBottom.classList.remove('visible');
    }

    function showResetButtons() {
      resetTop.classList.add('visible');
      resetBottom.classList.add('visible');
    }

    function hideResetButtons() {
      resetTop.classList.remove('visible');
      resetBottom.classList.remove('visible');
    }

    function handleSort() {
      const cells = Array.from(document.querySelectorAll('.cell'));
      
      const blueCells = cells.filter(cell => cell.classList.contains('blue'));
      const numBlue = blueCells.length;

      // Reset existing classes
      cells.forEach(c => c.classList.remove('blue', 'red'));

      // Blue fill order: Left column to right column, bottom to top
      const blueFillOrder = [
        20, 15, 10, 5, 0,
        21, 16, 11, 6, 1,
        22, 17, 12, 7, 2,
        23, 18, 13, 8, 3,
        24, 19, 14, 9, 4
      ];

      // Assign blue cells from left column to right
      for (let i = 0; i < numBlue; i++) {
        const targetIdx = blueFillOrder[i];
        cells[targetIdx].classList.add('blue');
      }

      // Assign red cells to all remaining positions
      for (let i = numBlue; i < 25; i++) {
        const targetIdx = blueFillOrder[i];
        cells[targetIdx].classList.add('red');
      }

      // Hide sort buttons and show reset buttons
      hideSortButtons();
      showResetButtons();
    }

    function resetGame() {
      selectedColor = null;
      updateButtonStyles();

      // Hide action buttons
      hideSortButtons();
      hideResetButtons();

      const cells = document.querySelectorAll('.cell');
      cells.forEach(cell => {
        cell.classList.remove('blue', 'red');
      });
    }

    sortTop.addEventListener('click', handleSort);
    sortBottom.addEventListener('click', handleSort);
    resetTop.addEventListener('click', resetGame);
    resetBottom.addEventListener('click', resetGame);
  </script>
</body>
</html>
